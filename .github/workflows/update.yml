name: Mise à jour quotidienne

on:
  schedule:
    # Tous les jours à 05:30 UTC (07:30 heure de Paris en été)
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collecter les données du jour
        run: python scripts/update_data.py

      - name: Publier les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +%F))"
            git push
          fi
