name: Supprimer des informations

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "IDs des informations à supprimer définitivement (séparés par des virgules)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Supprimer les éléments
        env:
          IDS_A_SUPPRIMER: ${{ inputs.ids }}
        run: python scripts/delete_items.py "$IDS_A_SUPPRIMER"

      - name: Publier les données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
          else
            git commit -m "Suppression d'informations demandée par l'utilisateur"
            git push
          fi

# Réenregistrement des workflows
